<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Styles/styles.css">
    <title>GESTOR DE PROYECTOS</title>
</head>
<body>

    <main class="contenedor_principal">
        <!--Titulo-->
        <header class="contenedor_1">
            <h1 class="titulo_1">Gestor de proyectos.</h1>
        </header>

        <!--Creación de proyectos-->
        <section class="contenedor_2">
            <h2 class="subtitulo">Crear proyecto.</h2>
            <input class="input_1" id="input_nombre_proyectos" type="text" placeholder="Nombre del proyecto">
            <button class="button_1" type="button" onclick="crearProyecto()">Crear proyecto</button>
            <button class="button_2" type="button" onclick="borrarProyectos()">Borrar todos los proyectos</button>
        </section>

        <!--Muestra los proyectos-->
        <section class="contenedor_3" id="div_proyectos">
            <h2 class="subtitulo_2">Proyectos:</h2>
        </section>
    </main>

    <!--Conexión Js-->
    <script src="Js/script.js"></script>
</body>
</html>
